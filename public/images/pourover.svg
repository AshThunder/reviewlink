<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Saturday pour-over tasting with Chinedu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE4D8"/>
      <stop offset="100%" stop-color="#8A6A4E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D8C8B0"/>
    </linearGradient>
    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A4A28"/>
      <stop offset="100%" stop-color="#2A1208"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="200" cy="60" rx="240" ry="110" fill="#F8F2EA" opacity="0.5"/>
  <ellipse cx="400" cy="440" rx="160" ry="20" fill="#3A2418" opacity="0.25"/>
  <!-- carafe body -->
  <path d="M320 200 L340 380 Q400 430 460 380 L480 200 Z" fill="url(#glass)" stroke="#D4C4AE" stroke-width="3"/>
  <path d="M328 250 L344 375 Q400 418 456 375 L472 250 Z" fill="url(#brew)"/>
  <ellipse cx="400" cy="250" rx="72" ry="14" fill="#5A2E18"/>
  <!-- dripper -->
  <path d="M300 200 L500 200 L460 110 L340 110 Z" fill="#2A2A28"/>
  <path d="M350 110 L450 110 L430 70 L370 70 Z" fill="#3A3A38"/>
  <!-- filter paper -->
  <path d="M355 195 L445 195 L425 120 L375 120 Z" fill="#F4E8D0"/>
  <ellipse cx="400" cy="120" rx="25" ry="8" fill="#D8C4A0"/>
  <!-- kettle spout stream -->
  <path d="M250 40 C250 40 260 80 400 95" fill="none" stroke="#9AB0C0" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M400 95 L400 118" fill="none" stroke="#9AB0C0" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- kettle hint -->
  <ellipse cx="230" cy="48" rx="48" ry="22" fill="#C4C8CC"/>
  <rect x="200" y="20" width="60" height="30" rx="8" fill="#D4D6D8"/>
  <!-- cup waiting -->
  <path d="M560 340 h90 v50 c0 24-20 40-45 40s-45-16-45-40z" fill="#F4EDE0"/>
  <ellipse cx="605" cy="340" rx="45" ry="14" fill="#FBF7F0"/>
  <ellipse cx="605" cy="346" rx="36" ry="10" fill="#3A1C10"/>
  <path d="M650 350c28 0 32 28 18 44" fill="none" stroke="#F4EDE0" stroke-width="10" stroke-linecap="round"/>
  <rect width="800" height="500" filter="url(#grain)" opacity="0.28"/>
</svg>
