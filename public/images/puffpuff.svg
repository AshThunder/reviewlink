<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Puff-puff and chocolate at Casa Lekki">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E7C8"/>
      <stop offset="100%" stop-color="#C9894A"/>
    </linearGradient>
    <radialGradient id="p1" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#FFE2A3"/><stop offset="55%" stop-color="#E8A043"/><stop offset="100%" stop-color="#B55E14"/></radialGradient>
    <radialGradient id="p2" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#FFE9B8"/><stop offset="55%" stop-color="#F0B35A"/><stop offset="100%" stop-color="#C46B1C"/></radialGradient>
    <radialGradient id="choc" cx="50%" cy="20%" r="70%"><stop offset="0%" stop-color="#6B3A22"/><stop offset="100%" stop-color="#2A140C"/></radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBF7F0"/><stop offset="100%" stop-color="#E2D2BC"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="400" cy="430" rx="280" ry="28" fill="#6A3A14" opacity="0.22"/>
  <ellipse cx="400" cy="360" rx="300" ry="110" fill="url(#plate)"/>
  <ellipse cx="400" cy="348" rx="270" ry="90" fill="#F3E8D6"/>
  <!-- chocolate ramekin -->
  <ellipse cx="560" cy="300" rx="70" ry="28" fill="#4A2A18"/>
  <ellipse cx="560" cy="292" rx="62" ry="22" fill="url(#choc)"/>
  <ellipse cx="545" cy="284" rx="20" ry="8" fill="#8B5A38" opacity="0.55"/>
  <!-- puff-puffs -->
  <circle cx="300" cy="280" r="86" fill="url(#p1)"/>
  <circle cx="288" cy="255" r="28" fill="#FFF0C8" opacity="0.5"/>
  <circle cx="430" cy="250" r="78" fill="url(#p2)"/>
  <circle cx="418" cy="228" r="24" fill="#FFF3D0" opacity="0.5"/>
  <circle cx="370" cy="330" r="70" fill="url(#p1)"/>
  <circle cx="358" cy="312" r="20" fill="#FFE8B0" opacity="0.45"/>
  <circle cx="500" cy="330" r="58" fill="url(#p2)"/>
  <circle cx="490" cy="314" r="16" fill="#FFF1C4" opacity="0.45"/>
  <rect width="800" height="500" filter="url(#grain)" opacity="0.3"/>
</svg>
